<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="image-grid" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#16181f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Build framed photo collages and social layouts in seconds. Pick a template, drop your photos, export high-res. Runs entirely in your browser."
    />
    <title>image-grid · instant photo collages</title>

    <link
      rel="preload"
      href="/Plus_Jakarta_Sans/PlusJakartaSans-VariableFont_wght.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />

    <script>
      // Resolve the theme before first paint so there is no flash of the wrong one.
      (function () {
        try {
          var saved = localStorage.getItem("ig:theme");
          var dark = saved
            ? saved === "dark"
            : !window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* private mode: fall through to the dark default on <html> */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
